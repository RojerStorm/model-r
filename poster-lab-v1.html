<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Poster Lab v1</title><link rel="preconnect" href="https://api.tvmaze.com"><link rel="preconnect" href="https://wsrv.nl"><style>:root{--bg:#0d1219;--card:#181f29;--line:#2f3a48;--text:#f7f9fc;--muted:#9faab8;--ok:#57c984;--bad:#e55b67;--accent:#77bfff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge,.counter{border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.sub{color:var(--muted);font-size:14px;line-height:1.5;margin:10px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}.card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:8px}.poster{width:100%;aspect-ratio:2/3;border-radius:11px;background:#111821;object-fit:cover;display:block}.title{font-weight:900;font-size:14px;line-height:1.25;margin:8px 2px 2px}.meta{font-size:11px;color:var(--muted);min-height:30px;margin:0 2px 4px}.meta.ok{color:var(--ok)}.meta.bad{color:var(--bad)}button{border:1px solid var(--line);background:#222b36;color:var(--text);border-radius:12px;padding:10px 12px;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.result{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#111821;font:13px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wrap{padding:12px}.title{font-size:13px}}</style></head><body><div class="wrap"><div class="head"><div class="badge">Poster Lab · Safari · v1</div><div id="counter" class="counter">0 / 10</div></div><div class="sub">Никаких JPG в GitHub. Схема теста: <b>TVmaze API → medium poster → wsrv.nl image proxy/cache → WebP 220×330</b>. Если TVmaze не даёт картинку, пробуем English Wikipedia → тот же wsrv. Это отдельная лаборатория, существующие опросы не менялись.</div><div id="grid" class="grid"></div><div class="actions"><button id="reload">↻ Повторить тест</button></div><div id="result" class="result">Ожидание…</div></div><script>const ITEMS=[['The White Lotus','The White Lotus'],['Big Little Lies','Big Little Lies (TV series)'],["The Queen's Gambit","The Queen's Gambit (miniseries)"],['The Bear','The Bear (TV series)'],['Killing Eve','Killing Eve'],['The Morning Show','The Morning Show (American TV series)'],['The Diplomat','The Diplomat (American TV series)'],['Only Murders in the Building','Only Murders in the Building'],['Ted Lasso','Ted Lasso'],['The Night Manager','The Night Manager (British TV series)']];const $=s=>document.querySelector(s),grid=$('#grid'),counter=$('#counter'),result=$('#result');let run=0,done=0,ok=0,rows=[];function proxify(u){return 'https://wsrv.nl/?url='+encodeURIComponent(u)+'&w=220&h=330&fit=cover&output=webp&q=72&maxage=1y'}function card(i,title){const el=document.createElement('div');el.className='card';el.innerHTML=`<img class="poster" alt="${title} poster" decoding="async" loading="lazy"><div class="title">${title}</div><div class="meta">ожидание…</div>`;grid.appendChild(el);return {el,img:el.querySelector('img'),meta:el.querySelector('.meta')}}function imageLoad(img,url,timeout=9000){return new Promise((resolve,reject)=>{let ended=false;const t=setTimeout(()=>{if(ended)return;ended=true;reject(new Error('image timeout'))},timeout);img.onload=()=>{if(ended)return;ended=true;clearTimeout(t);resolve()};img.onerror=()=>{if(ended)return;ended=true;clearTimeout(t);reject(new Error('image error'))};img.src=url})}async function tvmaze(title){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch('https://api.tvmaze.com/singlesearch/shows?q='+encodeURIComponent(title),{signal:c.signal,cache:'force-cache'});if(!r.ok)throw new Error('TVmaze HTTP '+r.status);const j=await r.json();const u=j?.image?.medium||j?.image?.original;if(!u)throw new Error('TVmaze no image');return u}finally{clearTimeout(t)}}async function wiki(page){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail|original&pithumbsize=500&titles='+encodeURIComponent(page);const r=await fetch(u,{signal:c.signal,cache:'force-cache'});if(!r.ok)throw new Error('Wiki HTTP '+r.status);const j=await r.json();const p=Object.values(j?.query?.pages||{})[0],src=p?.thumbnail?.source||p?.original?.source;if(!src)throw new Error('Wiki no image');return src}finally{clearTimeout(t)}}async function one(i,title,page,card,token){card.meta.textContent='TVmaze API…';let source='';try{const u=await tvmaze(title);if(token!==run)return;card.meta.textContent='TVmaze → wsrv…';await imageLoad(card.img,proxify(u));source='TVmaze + wsrv'}catch(e1){try{card.meta.textContent='Wikipedia → wsrv…';const u=await wiki(page);if(token!==run)return;await imageLoad(card.img,proxify(u));source='Wikipedia + wsrv'}catch(e2){source='FAIL: '+e1.message+' / '+e2.message}}if(token!==run)return;done++;if(source.startsWith('FAIL')){card.meta.className='meta bad';card.meta.textContent=source;rows[i]=`${i+1}. ${title} — FAIL`}else{ok++;card.meta.className='meta ok';card.meta.textContent='✓ '+source;rows[i]=`${i+1}. ${title} — OK · ${source}`}counter.textContent=`${done} / ${ITEMS.length}`;result.textContent=`POSTERS: ${ok}/${ITEMS.length}\n\n`+rows.filter(Boolean).join('\n')}async function start(){run++;const token=run;done=0;ok=0;rows=[];grid.innerHTML='';counter.textContent='0 / 10';result.textContent='Запускаю последовательный тест…';for(let i=0;i<ITEMS.length;i++){if(token!==run)return;const [t,p]=ITEMS[i],c=card(i,t);await one(i,t,p,c,token);await new Promise(r=>setTimeout(r,180))}}$('#reload').onclick=start;start();</script></body></html>
